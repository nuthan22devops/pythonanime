apiVersion: apps/v1
kind: Deployment

metadata:
  name: order-service
  namespace: 

spec:
  replicas: 2

  selector:
    matchLabels:
      app: order-service

  template:
    metadata:
      labels:
        app: order-service

    spec:
      containers:
        - name: order-service
          image: nuthan22/pyaniordr:4

          ports:
            - containerPort: 8000

          env:
            - name: DATABASE_URL
              value: "postgresql://anime:animepass@postgres:5432/anime_store"

apiVersion: apps/v1
kind: Deployment

metadata:
  name: checkout-service
  namespace: 

spec:
  replicas: 2

  selector:
    matchLabels:
      app: checkout-service

  template:
    metadata:
      labels:
        app: checkout-service

    spec:
      containers:
        - name: checkout-service
          image: nuthan22/pycheckoutse:latest

          ports:
            - containerPort: 8000

          env:
            - name: ORDER_SERVICE_URL
              value: "http://order-service:8000"
